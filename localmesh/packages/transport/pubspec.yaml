name: transport
description: Transport layer for LocalMesh — BLE, Wi-Fi Direct, and Mock transports.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain
  crypto_layer:
    path: ../crypto
  async: ^2.11.0
  flutter_reactive_ble: ^5.3.2
  # Bug 4: flutter_ble_peripheral removed — peripheral role is handled natively by
  # LocalMeshBleGattServer.kt via platform channels.  The unused package was merging
  # extra AndroidManifest permissions and registering a native plugin that can interfere
  # with BLE stack init on some devices.
